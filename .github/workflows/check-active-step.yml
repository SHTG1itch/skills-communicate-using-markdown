name: Check active lesson

on:
  workflow_call:
    inputs:
      issue-number:
        required: true
        type: string
      step:
        required: true
        type: number
    outputs:
      active:
        value: ${{ jobs.check.outputs.active }}

permissions:
  issues: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.lesson.outputs.active }}
    steps:
      - uses: actions/github-script@v7
        id: lesson
        env:
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          STEP: ${{ inputs.step }}
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: Number(process.env.ISSUE_NUMBER), per_page: 100
            });
            const lessons = comments.filter(c => c.user.login === 'github-actions[bot]' &&
              /^## Step \d+: (?!Passed|Keep going)/m.test(c.body));
            const latest = lessons.at(-1)?.body.match(/^## Step (\d+):/m)?.[1];
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId
            });
            // A queued run cannot consume a lesson unlocked by this same submission.
            const atSubmission = lessons.filter(c => c.created_at <= run.created_at)
              .at(-1)?.body.match(/^## Step (\d+):/m)?.[1];
            core.setOutput('active', latest === process.env.STEP && atSubmission === latest ? 'true' : 'false');
